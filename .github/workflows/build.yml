name: Build Lyrarma Cloud Client for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with Flet Pack
        run: |
          flet pack src/main.py --icon icon.ico --name "LyrarmaCloudClient" --add-data "src/lyrarma_cloud_client/assets;lyrarma_cloud_client/assets"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyrarma-Cloud-Client-Windows-Executable
          path: dist/*.exe
