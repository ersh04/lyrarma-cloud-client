[project]
name = "lyrarma-cloud-client"
version = "1.0.0"
description = "A desktop synchronization client for Lyrarma Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flet[desktop]==0.85.3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pystray==0.19.5",
    "Pillow>=10,<13",
    "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = [
    "flet-cli==0.85.3",
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
lyrarma-cloud = "lyrarma_cloud_client.ui:run"

[tool.flet]
org = "io.lyrarma"
product = "Lyrarma Cloud"
company = "Lyrarma"
copyright = "Copyright (c) 2026 Lyrarma"

[tool.flet.app]
path = "src"
module = "main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyrarma_cloud_client = ["assets/*.json", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

